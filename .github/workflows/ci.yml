# Every push and pull request is linted and built into a debug APK, uploaded
# as the run's artifact.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Lint and build
        run: ./gradlew --no-daemon --console=plain lint assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: Screenlet-Companion
          path: app/build/outputs/apk/debug/*.apk
